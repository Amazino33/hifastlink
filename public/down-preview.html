<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#060B18">

    <title>HiFastLink — We'll Be Right Back</title>

    <!-- Google Fonts: Outfit & Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Outfit"', 'system-ui', 'sans-serif'],
                        display: ['"Sora"', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        primary: '#007AFE',
                        accent: '#00F0FF',
                        dark: '#060B18',
                    }
                }
            }
        }
    </script>

    <style>
        html, body {
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }

        body {
            background-color: #060B18;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(0, 122, 254, 0.16) 0%, transparent 55%),
                radial-gradient(circle at 80% 85%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
                linear-gradient(to bottom, #060B18 0%, #030712 100%);
            color: #F1F5F9;
        }

        .cyber-grid {
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 160, 254, 0.18);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px -10px rgba(0, 122, 254, 0.15);
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .animate-ring {
            animation: pulse-ring 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .animate-float {
            animation: float 3.5s ease-in-out infinite;
        }
    </style>
</head>

<body class="font-sans antialiased relative flex flex-col justify-between items-center h-full w-full px-4 py-5 sm:py-8 overflow-hidden select-none">
    <!-- Grid Overlay -->
    <div class="fixed inset-0 cyber-grid pointer-events-none z-0"></div>

    <!-- Top Logo -->
    <header class="relative z-10 w-full max-w-sm mx-auto flex items-center justify-center shrink-0">
        <a href="/" class="flex items-center gap-2.5 transition-transform hover:scale-105 duration-200">
            <div class="w-8 h-8 rounded-xl bg-primary/20 border border-primary/30 flex items-center justify-center p-1 shadow-md shadow-primary/20">
                <svg viewBox="0 0 295 471" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full object-contain">
                    <path d="M295 307.098L144.293 207.696L0 307.098V470.631L144.293 358.403L295 470.631V307.098Z" fill="#7DD3FC"/>
                    <path d="M144.293 0L0 102.609V266.141L144.293 157.12L295 266.141V102.609L144.293 0Z" fill="#007AFE"/>
                </svg>
            </div>
            <span class="font-display text-xl font-bold tracking-tight text-white">
                HiFast<span class="text-primary">Link</span>
            </span>
        </a>
    </header>

    <!-- Center Card -->
    <main class="relative z-10 w-full max-w-[420px] mx-auto my-auto shrink-0 px-1">
        <div class="glass-card rounded-3xl p-7 sm:p-9 text-center">
            
            <!-- Icon -->
            <div class="relative w-16 h-16 mx-auto flex items-center justify-center mb-5">
                <div class="absolute inset-0 rounded-full border border-primary/20 animate-ring"></div>
                <div class="relative z-10 w-13 h-13 rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 border border-primary/40 flex items-center justify-center p-3 shadow-lg animate-float">
                    <svg class="w-7 h-7 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 10a7.5 7.5 0 0 0 7.5 7.5c2.3 0 4.4-.9 5.9-2.4"></path>
                        <path d="M6 14a4 4 0 0 0 4 4"></path>
                        <path d="M21 3l-7 7"></path>
                        <path d="M12 12l2.5 2.5"></path>
                        <path d="M8 21l4-4"></path>
                    </svg>
                </div>
            </div>

            <!-- Status Dot -->
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-medium tracking-wide mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                <span>MAINTENANCE</span>
            </div>

            <!-- Heading & Subtext -->
            <div class="space-y-1.5 mb-5">
                <h1 class="font-display text-2xl sm:text-[26px] font-bold text-white tracking-tight">
                    We'll Be Right Back
                </h1>
                <p class="text-slate-300 text-sm font-normal leading-relaxed">
                    Upgrading our network. Back online shortly.
                </p>
            </div>

            <!-- Compact Reassurance Pill -->
            <div class="inline-flex items-center gap-2 py-1.5 px-3.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-xs text-emerald-300 font-normal mb-6">
                <svg class="w-3.5 h-3.5 shrink-0 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                <span>WiFi hotspots remain online</span>
            </div>

            <!-- Refresh Button -->
            <div class="mb-6">
                <button onclick="checkStatus()" id="refresh-btn" class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3 rounded-xl bg-primary hover:bg-primary/90 text-white font-medium text-sm transition-all duration-200 transform active:scale-95 shadow-lg shadow-primary/25">
                    <svg id="refresh-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                    </svg>
                    <span id="refresh-text">Refresh</span>
                </button>
                <div id="status-toast" class="hidden text-xs text-slate-400 mt-2 font-mono"></div>
            </div>

            <!-- Support Icons Row -->
            <div class="pt-5 border-t border-slate-800/80 flex items-center justify-center gap-3.5">
                <a href="https://wa.me/2348012345678" target="_blank" class="w-10 h-10 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/20 text-emerald-400 hover:text-emerald-300 flex items-center justify-center transition-colors" title="WhatsApp Support">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                        <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.312.045-.634.072-1.074-.074-.356-.118-.84-.287-1.465-.558-1.571-.681-2.614-2.27-2.693-2.375-.078-.105-.638-.85-.638-1.623 0-.773.407-1.152.551-1.309.144-.157.315-.196.42-.196.105 0 .21.001.302.006.098.005.228-.037.356.27.131.315.446 1.087.485 1.166.039.078.065.17.013.275-.052.105-.079.17-.157.262-.078.092-.164.205-.235.275-.078.079-.16.165-.069.321.092.157.408.673.876 1.089.601.534 1.108.699 1.265.778.157.078.249.066.341-.039.092-.105.393-.459.498-.616.105-.157.21-.131.354-.078.144.052.917.433 1.074.512.157.078.262.118.301.184.039.066.039.38-.105.785z"/>
                    </svg>
                </a>
                <a href="tel:+2348012345678" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white flex items-center justify-center transition-colors" title="Call Support">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                    </svg>
                </a>
                <a href="mailto:support@hifastlink.com" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-slate-300 hover:text-white flex items-center justify-center transition-colors" title="Email Support">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                        <polyline points="22,6 12,13 2,6"/>
                    </svg>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 text-center text-[11px] text-slate-500 shrink-0">
        &copy; 2026 HiFastLink
    </footer>

    <!-- Refresh Script -->
    <script>
        async function checkStatus() {
            const icon = document.getElementById('refresh-icon');
            const text = document.getElementById('refresh-text');
            const toast = document.getElementById('status-toast');

            icon.classList.add('animate-spin');
            text.textContent = 'Checking...';

            try {
                const res = await fetch(window.location.href, { cache: 'no-store' });
                if (res.status === 200) {
                    text.textContent = 'Back online!';
                    window.location.reload();
                    return;
                }
            } catch (e) {}

            setTimeout(() => {
                icon.classList.remove('animate-spin');
                text.textContent = 'Refresh';
                if (toast) {
                    toast.textContent = 'Still updating. Check back soon.';
                    toast.classList.remove('hidden');
                }
            }, 500);
        }

        // Silent 30s auto-ping
        setInterval(async () => {
            try {
                const res = await fetch(window.location.href, { cache: 'no-store' });
                if (res.status === 200) window.location.reload();
            } catch (e) {}
        }, 30000);
    </script>
</body>
</html>
